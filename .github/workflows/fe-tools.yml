name: FE tools
on:
  workflow_dispatch:
  push:
    paths: ['tools/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - run: |
          cd tools
          for t in fe_info fe_tune; do
            arm-linux-gnueabihf-gcc -static -Os -o $t $t.c
            arm-linux-gnueabihf-strip $t
          done
      - uses: actions/upload-artifact@v7
        with:
          name: fe-tools
          path: |
            tools/fe_info
            tools/fe_tune
